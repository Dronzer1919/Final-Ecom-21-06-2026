services:
  mongo:
    image: mongo:7
    container_name: sindhu-mongo
    restart: unless-stopped
    command: ["--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sindhu-net

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sindhu-api
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sindhu-net

  web:
    build:
      context: .
      dockerfile: ionic-project/Dockerfile
    container_name: sindhu-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - sindhu-net

networks:
  sindhu-net:
    driver: bridge

volumes:
  mongo-data:
