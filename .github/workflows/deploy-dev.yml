name: Deploy Dev to Hostinger Docker

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev-docker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH using Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            chmod +x deploy/scripts/deploy-hostinger.sh
            APP_ROOT="${{ secrets.VPS_APP_DIR }}" BRANCH="dev" bash deploy/scripts/deploy-hostinger.sh

  summary:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "Workflow: Deploy Dev to Hostinger Docker"
          echo "Branch: dev"
          echo "Result: ${{ needs.deploy.result }}"
