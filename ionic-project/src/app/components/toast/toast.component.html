<div class="toast-container">
  <div class="toast" [class]="'toast toast-' + toast.type" *ngFor="let toast of toasts">
    <div class="toast-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path [attr.d]="getIcon(toast.type)"></path>
      </svg>
    </div>
    <div class="toast-message">{{ toast.message }}</div>
    <button class="toast-close" type="button" (click)="removeToast(toast.id)" aria-label="Dismiss notification">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
