<div class="products-grid-shimmer">
  <div class="product-card-shimmer" *ngFor="let item of items">
    <div class="shimmer-image">
      <app-shimmer-base></app-shimmer-base>
    </div>
    <div class="shimmer-content">
      <div class="shimmer-title">
        <app-shimmer-base></app-shimmer-base>
      </div>
      <div class="shimmer-subtitle">
        <app-shimmer-base></app-shimmer-base>
      </div>
      <div class="shimmer-price">
        <div class="shimmer-price-current">
          <app-shimmer-base></app-shimmer-base>
        </div>
        <div class="shimmer-price-old">
          <app-shimmer-base></app-shimmer-base>
        </div>
      </div>
      <div class="shimmer-actions">
        <div class="shimmer-button-large">
          <app-shimmer-base></app-shimmer-base>
        </div>
        <div class="shimmer-button-small">
          <app-shimmer-base></app-shimmer-base>
        </div>
      </div>
    </div>
  </div>
</div>
