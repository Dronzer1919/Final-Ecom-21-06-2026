<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">Variant Attributes</h1>
    <div class="header-actions">
      <button class="btn-add" routerLink="/dashboard/create-variant-attribute">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Attribute
      </button>
    </div>
  </div>

  <div class="table-container">
    <div class="table-header">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input 
          type="text" 
          placeholder="Search" 
          [(ngModel)]="searchQuery"
        />
      </div>
      <div class="filter-status">
        <select [(ngModel)]="statusFilter">
          <option value="">Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
    </div>

    <!-- Shimmer Loading State -->
    <app-shimmer *ngIf="isLoading" type="b2b-table" [count]="10"></app-shimmer>

    <table *ngIf="!isLoading" class="data-table">
      <thead>
        <tr>
          <th>Variant Name</th>
          <th>Variant Values</th>
          <th>Created On</th>
          <th>Status</th>
          <th class="actions-column"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let attr of paginatedVariantAttributes">
          <td class="variant-name">{{ attr.variantName }}</td>
          <td class="variant-values">{{ getValuesString(attr.values) }}</td>
          <td class="created-on">{{ attr.createdOn }}</td>
          <td>
            <span class="status-badge" [class.active]="attr.status === 'Active'" [class.inactive]="attr.status === 'Inactive'">
              {{ attr.status }}
            </span>
          </td>
          <td class="actions-column">
            <button class="action-btn" (click)="editVariantAttribute(attr.id)" title="Edit">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button><button class="action-btn delete" (click)="deleteVariantAttribute(attr.id)" title="Delete">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!isLoading" class="table-footer">
      <div class="rows-per-page">
        <span>Row Per Page</span>
        <select [(ngModel)]="rowsPerPage" (change)="onRowsPerPageChange()">
          <option [value]="10">10</option>
          <option [value]="25">25</option>
          <option [value]="50">50</option>
        </select>
        <span>Entries</span>
      </div>
      <div class="pagination">
        <button 
          class="page-btn" 
          (click)="goToPage(currentPage - 1)" 
          [disabled]="currentPage === 1"
        >
          &lt;
        </button>
        <button 
          *ngFor="let page of pageNumbers" 
          class="page-btn" 
          [class.active]="currentPage === page"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
        <button 
          class="page-btn" 
          (click)="goToPage(currentPage + 1)" 
          [disabled]="currentPage === totalPages"
        >
          &gt;
        </button>
      </div>
    </div>
  </div>
</div>
