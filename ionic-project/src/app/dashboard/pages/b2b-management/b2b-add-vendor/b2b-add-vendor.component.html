<div class="add-vendor-page">

  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <a routerLink="/dashboard/b2b-management/vendors" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        B2B Vendors
      </a>
      <h1 class="page-title">{{ isEditMode ? 'Edit Vendor' : 'Add Vendor' }}</h1>
      <p class="page-subtitle">{{ isEditMode ? 'Update vendor information' : 'Create a new B2B vendor / supplier' }}</p>
    </div>
  </div>

  <!-- Error -->
  <div class="alert alert-error" *ngIf="errorMessage">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {{ errorMessage }}
  </div>

  <form [formGroup]="vendorForm" (ngSubmit)="onSubmit()">

    <!-- Basic Info -->
    <div class="form-card">
      <h2 class="card-title">
        <span class="card-icon">🏪</span>
        Vendor Information
      </h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Vendor Name <span class="req">*</span></label>
          <input type="text" formControlName="name" placeholder="e.g. Agro Fresh Traders">
          <span class="field-error" *ngIf="vendorForm.get('name')?.invalid && vendorForm.get('name')?.touched">
            Vendor name is required
          </span>
        </div>
        <div class="form-group">
          <label>Vendor Code</label>
          <input type="text" formControlName="supplierCode" placeholder="e.g. VEN-001">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="vendor@example.com">
          <span class="field-error" *ngIf="vendorForm.get('email')?.invalid && vendorForm.get('email')?.touched">
            Enter a valid email
          </span>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" formControlName="phone" placeholder="+91 9876543210">
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <input type="text" formControlName="address" placeholder="Street address">
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" formControlName="city" placeholder="e.g. Mumbai">
        </div>
        <div class="form-group">
          <label>State / Location</label>
          <input type="text" formControlName="location" placeholder="e.g. Maharashtra">
        </div>
        <div class="form-group">
          <label>Locality</label>
          <input type="text" formControlName="locality" placeholder="e.g. APMC Navi Mumbai">
        </div>
        <div class="form-group">
          <label>Country</label>
          <input type="text" formControlName="country" placeholder="India">
        </div>
      </div>
    </div>

    <!-- B2B Details -->
    <div class="form-card">
      <h2 class="card-title">
        <span class="card-icon">📊</span>
        B2B Details
      </h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Rating (1–5)</label>
          <input type="number" formControlName="rating" min="1" max="5" step="0.1" placeholder="4.0">
          <span class="field-error" *ngIf="vendorForm.get('rating')?.invalid && vendorForm.get('rating')?.touched">
            Must be between 1 and 5
          </span>
        </div>
        <div class="form-group">
          <label>Response Rate (%)</label>
          <input type="number" formControlName="responseRate" min="0" max="100" placeholder="100">
        </div>
        <div class="form-group">
          <label>Min. Order Qty</label>
          <input type="number" formControlName="minOrderQty" min="1" placeholder="1">
        </div>
        <div class="form-group">
          <label>Product Variety / Grade</label>
          <input type="text" formControlName="variety" placeholder="e.g. Grade A, 1121 Basmati">
        </div>
        <div class="form-group">
          <label>Member Since</label>
          <input type="text" formControlName="memberSince" placeholder="e.g. 2019">
        </div>
      </div>
    </div>

    <!-- GST -->
    <div class="form-card">
      <h2 class="card-title">
        <span class="card-icon">📋</span>
        GST Information
      </h2>
      <div class="form-grid">
        <div class="form-group full-width">
          <label class="toggle-row">
            <input type="checkbox" formControlName="hasGST" class="toggle-checkbox">
            <span class="toggle-slider-wrap">
              <span class="toggle-slider"></span>
            </span>
            <span class="toggle-label">Has GST Registration</span>
          </label>
        </div>
        <div class="form-group" *ngIf="vendorForm.value.hasGST">
          <label>GST Number</label>
          <input type="text" formControlName="gstNumber" placeholder="22AAAAA0000A1Z5"
                 style="text-transform:uppercase">
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()" [disabled]="isSubmitting">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ isEditMode ? 'Update Vendor' : 'Add Vendor' }}
        </span>
        <span *ngIf="isSubmitting">Saving...</span>
      </button>
    </div>

  </form>
</div>
