<div class="manage-stock-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Manage Stock</h1>
    </div>
    <div class="header-actions">
      <button class="btn-icon btn-pdf" (click)="exportPDF()" title="Export to PDF">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </button>
      <button class="btn-icon btn-excel" (click)="exportExcel()" title="Export to Excel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </button>
      <app-theme-button type="primary" [routerLink]="['/dashboard/stock/adjustment']">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Adjust Stock
      </app-theme-button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" placeholder="Search" [(ngModel)]="searchTerm" />
    </div>
    <div class="filter-actions">
      <select class="filter-select" [(ngModel)]="selectedWarehouse">
        <option value="">All Warehouses</option>
        <option value="Warehouse 1">Warehouse 1</option>
        <option value="Warehouse 2">Warehouse 2</option>
        <option value="Warehouse 3">Warehouse 3</option>
      </select>
      <select class="filter-select" [(ngModel)]="selectedStatus">
        <option value="">All Status</option>
        <option value="In Stock">In Stock</option>
        <option value="Low Stock">Low Stock</option>
        <option value="Out of Stock">Out of Stock</option>
      </select>
    </div>
  </div>

  <!-- Shimmer Loading State -->
  <app-shimmer-table *ngIf="isLoading" page="manage-stock"></app-shimmer-table>

  <div class="table-container" *ngIf="!isLoading">

    <table class="data-table">
      <thead>
        <tr>
          <th>Product Code</th>
          <th>Product Name</th>
          <th>Category</th>
          <th>Warehouse</th>
          <th>Quantity</th>
          <th>Alert Quantity</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let stock of paginatedStocks" class="stock-row">
          <td>{{ stock.productCode }}</td>
          <td>{{ stock.productName }}</td>
          <td>{{ stock.category }}</td>
          <td>{{ stock.warehouse }}</td>
          <td><strong>{{ stock.quantity }}</strong></td>
          <td>{{ stock.alertQuantity }}</td>
          <td class="status-cell">
            <span class="status-badge" [ngClass]="stock.status === 'In Stock' ? 'in-stock' : stock.status === 'Low Stock' ? 'low-stock' : 'out-of-stock'">
              ● {{ stock.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

  <!-- Pagination -->
  <div class="pagination-bar">
    <div class="rows-per-page">
      <span>Row Per Page</span>
      <select [value]="rowsPerPage" (change)="rowsPerPage = +$any($event.target).value; currentPage = 1">
        <option [value]="10">10</option>
        <option [value]="25">25</option>
        <option [value]="50">50</option>
        <option [value]="100">100</option>
      </select>
      <span class="entries-info">Entries</span>
    </div>
    <div class="pagination-controls">
      <button class="page-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button *ngFor="let page of pageNumbers" class="page-btn" [class.active]="page === currentPage" (click)="goToPage(page)">{{ page }}</button>
      <button class="page-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>
</div>
