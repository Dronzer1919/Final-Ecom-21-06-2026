<div class="brands-page">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Brands</h1>
    </div>
    <div class="header-actions">
      <button class="btn-icon btn-pdf" (click)="exportPDF()" title="Export to PDF">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </button>
      <button class="btn-icon btn-excel" (click)="exportExcel()" title="Export to Excel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </button>
      <button class="btn-icon btn-refresh" (click)="refresh()" title="Refresh">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
      <button class="btn-icon btn-sort" title="Sort">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
      </button>
      <app-theme-button type="primary" (clicked)="addBrand()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Brand
      </app-theme-button>
      <app-theme-button type="outline" (clicked)="importBrand()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Import Brand
      </app-theme-button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" placeholder="Search" (input)="onSearch($event)" [value]="searchTerm" />
    </div>
    <div class="filter-actions">
      <select class="filter-select" [(ngModel)]="selectedStatus" (change)="onStatusChange()">
        <option value="Status">Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </div>

  <!-- Shimmer Loading State -->
  <app-shimmer-table *ngIf="isLoading" page="brands"></app-shimmer-table>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="error-state">
    <p>{{ error }}</p>
    <app-theme-button type="primary" (clicked)="refresh()">Retry</app-theme-button>
  </div>

  <!-- Brands Table -->
  <div class="table-container" *ngIf="!isLoading && !error">
    <table class="data-table">
      <thead>
        <tr>
          <th>Brand</th>
          <th>Code</th>
          <th>Created Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="brands.length === 0">
          <td colspan="5" class="no-data">No brands found</td>
        </tr>
        <tr *ngFor="let row of paginatedBrands" class="brand-row">
          <td><span class="brand-cell">{{ row.name }}</span></td>
          <td><span class="code-cell">{{ row.code }}</span></td>
          <td><span class="date-cell">{{ formatDate(row.createdAt) }}</span></td>
          <td class="status-cell">
            <span class="status-badge" [class]="row.isActive === false ? 'inactive' : 'active'">
              &#9679; {{ getStatusText(row.isActive) }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="action-btn" (click)="editBrand(row)" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="action-btn delete-btn" (click)="deleteBrand(row)" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination-bar">
    <div class="rows-per-page">
      <span>Row Per Page</span>
      <select [value]="rowsPerPage" (change)="onRowsPerPageChange($event)">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
      <span class="entries-info">Entries</span>
    </div>
    <div class="pagination-controls">
      <button class="page-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button *ngFor="let page of pageNumbers" class="page-btn" [class.active]="page === currentPage" (click)="goToPage(page)">{{ page }}</button>
      <button class="page-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>
  <div class="edit-modal-overlay" *ngIf="showEditModal" (click)="closeEditModal()">
    <div class="edit-modal" (click)="$event.stopPropagation()">
      <div class="edit-modal-header">
        <h2>Edit Brand</h2>
        <button class="edit-modal-close" (click)="closeEditModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="edit-modal-body">
        <div class="edit-alert" *ngIf="editError">{{ editError }}</div>
        <div class="edit-form-grid">
          <div class="edit-form-group">
            <label>Brand Name *</label>
            <input type="text" [(ngModel)]="editingBrand.name" placeholder="Enter brand name" />
          </div>
          <div class="edit-form-group">
            <label>Brand Code *</label>
            <input type="text" [(ngModel)]="editingBrand.code" placeholder="Enter brand code" style="text-transform:uppercase" />
          </div>
          <div class="edit-form-group full">
            <label>Description</label>
            <textarea [(ngModel)]="editingBrand.description" placeholder="Enter description" rows="3"></textarea>
          </div>
          <div class="edit-form-group">
            <label>Logo URL</label>
            <input type="text" [(ngModel)]="editingBrand.logo" placeholder="Enter logo URL" />
          </div>
          <div class="edit-form-group">
            <label>Website</label>
            <input type="text" [(ngModel)]="editingBrand.website" placeholder="Enter website URL" />
          </div>
          <div class="edit-form-group">
            <label>Status</label>
            <select [(ngModel)]="editingBrand.isActive">
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
          </div>
        </div>
      </div>
      <div class="edit-modal-footer">
        <button class="btn-edit-cancel" (click)="closeEditModal()" [disabled]="isEditSubmitting">Cancel</button>
        <button class="btn-edit-save" (click)="saveEditBrand()" [disabled]="isEditSubmitting">
          {{ isEditSubmitting ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </div>
  </div>
</div>
