<div class="cd-overlay" (click)="cancelled.emit()">
  <div class="cd-box" (click)="$event.stopPropagation()">
    <div class="cd-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
    </div>
    <h3 class="cd-title">{{ title }}</h3>
    <p class="cd-message">{{ message }}</p>
    <div class="cd-actions">
      <button class="cd-btn cancel" (click)="cancelled.emit()" [disabled]="isLoading">
        {{ cancelLabel }}
      </button>
      <button class="cd-btn confirm" (click)="confirmed.emit()" [disabled]="isLoading">
        {{ isLoading ? 'Deleting...' : confirmLabel }}
      </button>
    </div>
  </div>
</div>
