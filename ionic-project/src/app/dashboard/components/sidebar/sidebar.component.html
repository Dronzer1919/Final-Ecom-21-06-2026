<aside class="sidebar">
  <div class="sidebar-content">
    <nav class="sidebar-nav">
      <ng-container *ngFor="let group of filteredMenuItems">
        <!-- Category Header (Accordion) -->
        <button
          class="nav-category"
          (click)="toggleMenu(group)"
          [class.expanded]="group.expanded"
          *ngIf="group.label"
        >
          <span class="category-label">{{ group.label }}</span>
          <svg class="category-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- Menu Items -->
        <ul class="nav-list" *ngIf="group.expanded">
          <li *ngFor="let item of group.children" class="nav-item">
            <a
              *ngIf="item.route && !item.children && !item.disabled"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
            </a>

            <span
              *ngIf="item.route && !item.children && item.disabled"
              class="nav-link disabled"
              title="Coming soon"
            >
              <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
            </span>

            <button
              *ngIf="item.children"
              class="nav-link"
              (click)="toggleMenu(item)"
              [class.expanded]="item.expanded"
            >
              <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
              <svg class="nav-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <!-- Submenu -->
            <ul class="submenu" *ngIf="item.children && item.expanded">
              <li *ngFor="let subItem of item.children" class="submenu-item">
                <a
                  [routerLink]="subItem.route"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="submenu-link"
                >
                  <span class="submenu-label">{{ subItem.label }}</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </ng-container>
    </nav>
  </div>
</aside>
