      <!-- Notifications -->
      <div class="notification-wrapper" (click)="$event.stopPropagation()">
        <button class="action-btn icon-btn" (click)="toggleNotifications(); $event.stopPropagation()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>
        
        <!-- Notifications Dropdown -->
        <div class="dropdown notifications-dropdown" *ngIf="showNotifications">
          <div class="dropdown-header">
            <h3>Notifications</h3>
            <button class="mark-all-read">Mark all as read</button>
          </div>
          <div class="dropdown-body">
            <div class="notification-item" *ngFor="let notification of notifications" [class.unread]="!notification.read">
              <div class="notification-content">
                <p>{{ notification.message }}</p>
                <span class="notification-time">{{ notification.time }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Theme Switcher -->
      <div class="theme-switcher-wrapper" (click)="$event.stopPropagation()">
        <button class="action-btn theme-toggle-btn" (click)="toggleThemeDropdown($event)" title="Change Theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 1 0 9 10 10 0 0 0 0-18z"></path>
          </svg>
          <span>Theme</span>
          <svg class="chevron-icon" [class.rotated]="themeDropdownOpen" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="theme-dropdown" *ngIf="themeDropdownOpen">
          <div class="theme-dropdown-header">Choose Theme</div>
          <button
            *ngFor="let theme of themes"
            class="theme-option"
            [class.active]="currentTheme === theme.name"
            (click)="selectTheme(theme.name, $event)">
            <span class="theme-swatch theme-swatch--{{ theme.name }}"></span>
            <div class="theme-info">
              <span class="theme-label">{{ theme.label }}</span>
              <span class="theme-desc">{{ theme.description }}</span>
            </div>
            <svg *ngIf="currentTheme === theme.name" class="check-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- User Profile -->
      <div class="profile-wrapper" (click)="$event.stopPropagation()">
        <button class="profile-btn" (click)="toggleProfile(); $event.stopPropagation()">
          <img src="assets/images/avatar.jpg" alt="User" class="avatar" />
        </button>
        
        <!-- Profile Dropdown -->
        <div class="dropdown profile-dropdown" *ngIf="showProfile">
          <div class="profile-info">
            <img src="assets/images/avatar.jpg" alt="User" class="avatar-large" />
            <div class="profile-details">
              <h4>{{ userFullName() }}</h4>
              <p>{{ userEmail() }}</p>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-menu">
            <a routerLink="/dashboard/profile" class="dropdown-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span>My Profile</span>
            </a>
            <a routerLink="/dashboard/settings" class="dropdown-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v6m0 6v6"/>
              </svg>
              <span>Settings</span>
            </a>
            <button class="dropdown-item" (click)="resetPassword()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <span>Reset Password</span>
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" (click)="logout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
