<div class="brands-page">
  <header class="page-header">
    <div class="container">
      <button class="back-btn" (click)="navigateHome()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
        Back to Home
      </button>
      <div class="header-info">
        <h1>All Brands</h1>
        <p class="subtitle" *ngIf="totalBrands > 0">Browse our collection of {{ totalBrands }} brands</p>
      </div>
    </div>
  </header>

  <div class="container">
    <div *ngIf="loading" class="shimmer-grid">
      <div class="shimmer-card" *ngFor="let item of shimmerBrands">
        <div class="shimmer shimmer-avatar"></div>
        <div class="shimmer shimmer-text-title"></div>
        <div class="shimmer shimmer-text-short"></div>
        <div class="shimmer shimmer-badge"></div>
      </div>
    </div>

    <div *ngIf="error && !loading" class="error-message">
      <p>{{ error }}</p>
      <button class="btn-retry" (click)="retry()">Retry</button>
    </div>

    <div *ngIf="!loading && !error">
      <div class="brands-grid" *ngIf="brands.length > 0">
        <div class="brand-card" *ngFor="let brand of brands">
          <div class="brand-logo">
            <img [src]="getBrandLogo(brand)" [alt]="brand.name" loading="lazy">
          </div>
          <div class="brand-info">
            <h3>{{ brand.name }}</h3>
            <p class="brand-description" *ngIf="brand.description">{{ brand.description }}</p>
            <span class="status-badge" [class.active]="brand.isActive" [class.inactive]="!brand.isActive">
              {{ brand.isActive ? 'Active' : 'Inactive' }}
            </span>
          </div>
        </div>
      </div>

      <div class="empty-state" *ngIf="brands.length === 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
        <h3>No brands found</h3>
        <p>There are no brands available at the moment.</p>
      </div>

      <div class="shimmer-grid" *ngIf="loadingMore">
        <div class="shimmer-card" *ngFor="let item of shimmerBrands">
          <div class="shimmer shimmer-avatar"></div>
          <div class="shimmer shimmer-text-title"></div>
          <div class="shimmer shimmer-text-short"></div>
          <div class="shimmer shimmer-badge"></div>
        </div>
      </div>

      <div class="end-state" *ngIf="brands.length > 0 && !hasMoreData && !loadingMore">
        <p>All {{ totalBrands }} brands loaded</p>
      </div>

      <div #loadTrigger class="load-trigger" *ngIf="hasMoreData && brands.length > 0"></div>
    </div>
  </div>
</div>
