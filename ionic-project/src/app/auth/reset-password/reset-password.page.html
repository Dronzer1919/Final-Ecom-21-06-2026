<div class="auth-container">
  <div class="auth-content">
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <div class="auth-form-content">
          <div class="title-with-back">
            <button type="button" class="back-button" routerLink="/auth/sign-in">
              <ion-icon name="arrow-back"></ion-icon>
            </button>
            <h1 class="auth-title">Reset Password</h1>
          </div>
          <p class="auth-subtitle">Enter your new password below.</p>

          <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
          <div class="success-message" *ngIf="successMessage">
            <ion-icon name="checkmark-circle-outline"></ion-icon>
            {{ successMessage }}
          </div>

          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage && token">
            <div class="form-group">
              <label class="form-label">New Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <input [type]="showPassword ? 'text' : 'password'" class="form-input"
                  [class.input-error]="isFieldInvalid('password')"
                  formControlName="password" placeholder="At least 6 characters" />
                <button type="button" class="input-icon icon-button" (click)="togglePassword()">
                  <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
                </button>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('password')">Minimum 6 characters required</span>
            </div>

            <div class="form-group">
              <label class="form-label">Confirm Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-input"
                  [class.input-error]="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched"
                  formControlName="confirmPassword" placeholder="Re-enter new password" />
                <button type="button" class="input-icon icon-button" (click)="toggleConfirmPassword()">
                  <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
                </button>
              </div>
              <span class="error-text" *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched">
                Passwords do not match
              </span>
            </div>

            <app-theme-button type="primary" [fullWidth]="true" [disabled]="isLoading" (clicked)="onSubmit()">
              <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
              <span *ngIf="!isLoading">Reset Password</span>
            </app-theme-button>
          </form>

          <p class="auth-link" *ngIf="!token">
            <a routerLink="/auth/forgot-password">Request a new reset link</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
