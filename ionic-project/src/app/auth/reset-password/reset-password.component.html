<div class="auth-container">
  <div class="auth-content">
    <!-- Left Section - Form -->
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="assets/images/logo.png" alt="" />
        </div>

        <!-- Reset Password Form -->
        <div class="auth-form-content">
          <h1 class="auth-title">Reset password?</h1>
          <p class="auth-subtitle">Enter your new password below. Must be at least 8 characters.</p>

          <!-- Error Message -->
          <div class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <!-- Success Message -->
          <div class="success-message" *ngIf="successMessage">
            {{ successMessage }}
          </div>

          <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
            <!-- New Password Field -->
            <div class="form-group">
              <label for="newPassword" class="form-label">New Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <input
                  id="newPassword"
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-input"
                  [class.input-error]="isFieldInvalid('newPassword')"
                  formControlName="newPassword"
                  placeholder="Enter new password"
                />
                <button
                  type="button"
                  class="input-icon icon-button"
                  (click)="togglePasswordVisibility('password')"
                >
                  <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                    <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                    <path d="m2 2 20 20"/>
                  </svg>
                </button>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('newPassword')">
                {{ getErrorMessage('newPassword') }}
              </span>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <input
                  id="confirmPassword"
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  class="form-input"
                  [class.input-error]="isFieldInvalid('confirmPassword')"
                  formControlName="confirmPassword"
                  placeholder="Re-enter password"
                />
                <button
                  type="button"
                  class="input-icon icon-button"
                  (click)="togglePasswordVisibility('confirmPassword')"
                >
                  <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                    <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                    <path d="m2 2 20 20"/>
                  </svg>
                </button>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('confirmPassword')">
                {{ getErrorMessage('confirmPassword') }}
              </span>
            </div>

            <!-- Change Password Button -->
            <app-theme-button type="primary" [fullWidth]="true" [disabled]="isLoading" (clicked)="onSubmit()">
              <span *ngIf="!isLoading">Change Password</span>
              <span *ngIf="isLoading">Changing Password...</span>
            </app-theme-button>
          </form>

          <!-- Return to Login Link -->
          <div class="auth-footer-link">
            <a routerLink="/auth/signin">Return to Login</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section - Image -->
    <div class="auth-image-section">
      <img src="assets/svg/Forgot password-amico.svg" alt="Reset Password" />
    </div>
  </div>
</div>
