<div class="auth-container">
  <div class="auth-content">
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <div class="auth-form-content">
          <div class="title-with-back">
            <button type="button" class="back-button" routerLink="/home">
              <ion-icon name="arrow-back"></ion-icon>
            </button>
            <h1 class="auth-title">Sign In</h1>
          </div>
          <p class="auth-subtitle">Access your account using your email and password.</p>

          <div class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label for="email" class="form-label">Email <span class="required">*</span></label>
              <div class="input-wrapper">
                <input
                  id="email"
                  type="email"
                  class="form-input"
                  [class.input-error]="isFieldInvalid('email')"
                  formControlName="email"
                  placeholder="Enter your email"
                />
                <span class="input-icon">
                  <ion-icon name="mail-outline"></ion-icon>
                </span>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('email')">
                {{ getErrorMessage('email') }}
              </span>
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <input
                  id="password"
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-input"
                  [class.input-error]="isFieldInvalid('password')"
                  formControlName="password"
                  placeholder="Enter your password"
                />
                <button
                  type="button"
                  class="input-icon icon-button"
                  (click)="togglePasswordVisibility()"
                >
                  <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
                </button>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('password')">
                {{ getErrorMessage('password') }}
              </span>
            </div>

            <div class="form-options">
              <label class="checkbox-wrapper">
                <input type="checkbox" formControlName="rememberMe" />
                <span class="checkbox-label">Remember Me</span>
              </label>
            </div>

            <app-theme-button type="primary" [fullWidth]="true" [disabled]="isLoading" (clicked)="onSubmit()">
              <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
              <span *ngIf="!isLoading">Sign In</span>
              <span *ngIf="isLoading">Signing In...</span>
            </app-theme-button>
          </form>

          <div class="auth-footer-link">
            <span>New on our platform?</span>
            <a routerLink="/auth/sign-up">Create an account</a>
          </div>
        </div>
      </div>
    </div>

    <div class="auth-image-section">
      <div class="auth-image-content">
        <img src="assets/svg/Mobile login-pana.svg" alt="Sign In" class="auth-illustration">
        <h2>Welcome Back!</h2>
        <p>Sign in to access your account and continue shopping</p>
      </div>
    </div>
  </div>
</div>
