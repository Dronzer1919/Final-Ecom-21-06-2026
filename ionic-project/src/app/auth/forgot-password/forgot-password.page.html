<div class="auth-container">
  <div class="auth-content">
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <div class="auth-form-content">
          <div class="title-with-back">
            <button type="button" class="back-button" routerLink="/auth/sign-in">
              <ion-icon name="arrow-back"></ion-icon>
            </button>
            <h1 class="auth-title">Forgot Password</h1>
          </div>
          <p class="auth-subtitle">Enter your registered email to receive a reset link.</p>

          <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
          <div class="success-message" *ngIf="successMessage">
            <ion-icon name="checkmark-circle-outline"></ion-icon>
            {{ successMessage }}
          </div>

          <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
            <div class="form-group">
              <label class="form-label">Email Address <span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="email" class="form-input" [class.input-error]="isFieldInvalid('email')"
                  formControlName="email" placeholder="Enter your registered email" />
                <span class="input-icon"><ion-icon name="mail-outline"></ion-icon></span>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('email')">Please enter a valid email</span>
            </div>

            <app-theme-button type="primary" [fullWidth]="true" [disabled]="isLoading" (clicked)="onSubmit()">
              <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
              <span *ngIf="!isLoading">Send Reset Link</span>
            </app-theme-button>
          </form>

          <p class="auth-link">Remembered it? <a routerLink="/auth/sign-in">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
