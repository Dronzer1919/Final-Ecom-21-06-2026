<div class="auth-container">
  <div class="auth-content">
    <!-- Left Section - Form -->
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="assets/images/logo.png" alt="" />
        </div>

        <!-- Forgot Password Form -->
        <div class="auth-form-content">
          <h1 class="auth-title">Forgot password?</h1>
          <p class="auth-subtitle">Enter your email address and we'll send you an OTP to reset your password.</p>

          <!-- Error Message -->
          <div class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <!-- Success Message -->
          <div class="success-message" *ngIf="successMessage">
            {{ successMessage }}
          </div>

          <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
            <!-- Email Field -->
            <div class="form-group">
              <label for="email" class="form-label">Email Address <span class="required">*</span></label>
              <div class="input-wrapper">
                <input
                  id="email"
                  type="email"
                  class="form-input"
                  [class.input-error]="isFieldInvalid('email')"
                  formControlName="email"
                  placeholder="Enter your email"
                />
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m2 7 10 6 10-6"/>
                  </svg>
                </span>
              </div>
              <span class="error-text" *ngIf="isFieldInvalid('email')">
                {{ getErrorMessage('email') }}
              </span>
            </div>

            <!-- Submit Button -->
            <app-theme-button type="primary" [fullWidth]="true" [disabled]="isLoading" (clicked)="onSubmit()">
              <span *ngIf="!isLoading">Submit</span>
              <span *ngIf="isLoading">Sending...</span>
            </app-theme-button>
          </form>

          <!-- Return to Login Link -->
          <div class="auth-footer-link">
            <a routerLink="/auth/signin">Return to Login</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section - Image -->
    <div class="auth-image-section">
      <img src="assets/svg/forgetPassword.svg" alt="Forgot Password" />
    </div>
  </div>
</div>
