# Host reverse proxy for routeretail.com (single domain + /api layout).
# Frontend (Ionic SPA) is served at the root, backend API under /api.
# Certbot will add the matching listen 443 / SSL blocks when you run:
#   sudo certbot --nginx -d routeretail.com -d www.routeretail.com

server {
    listen 80;
    listen [::]:80;
    server_name routeretail.com www.routeretail.com;

    # Allow large uploads (backend accepts up to 10mb JSON / form bodies)
    client_max_body_size 15m;

    # Backend API -> api container.
    # No URI on proxy_pass, so the original /api/... path is preserved
    # (Express mounts every route under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend SPA -> web container (internal nginx handles client-side routing)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/routeretail_access.log;
    error_log  /var/log/nginx/routeretail_error.log;
}
